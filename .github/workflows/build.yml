name: Build IFLAPP

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'details.xml'
      - 'src/**'
      - 'lib/**'
      - 'shell/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  parse-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      app_name: ${{ steps.extract.outputs.app_name }}
      publisher: ${{ steps.extract.outputs.publisher }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract metadata from details.xml
        id: extract
        run: |
          if [ -f details.xml ]; then
            VERSION=$(grep -oP '<version>\K[^<]+' details.xml | head -1)
            APP_NAME=$(grep -oP '<app>\K[^<]+' details.xml | head -1)
            PUBLISHER=$(grep -oP '<publisher>\K[^<]+' details.xml | head -1)
            if [ -z "$PUBLISHER" ]; then
              PUBLISHER=$(grep -oP '<empresa>\K[^<]+' details.xml | head -1)
            fi
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
            echo "publisher=${PUBLISHER}" >> $GITHUB_OUTPUT
            echo "✅ Metadata extracted: $PUBLISHER.$APP_NAME v$VERSION"
          else
            echo "❌ details.xml not found"
            exit 1
          fi

  build:
    needs: parse-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            target_platform: Linux
          - os: windows-latest
            os_name: windows
            target_platform: Windows
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lib/requirements.txt
        shell: bash
      
      - name: Compile with PackageMaker CLI (Headless)
        run: |
          python packagemaker.py \
            --buildthis . \
            --output "$RUNNER_TEMP/packagemaker-output" \
            --platform ${{ matrix.target_platform }}
        shell: bash
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iflapp-${{ matrix.os_name }}
          path: ${{ runner.temp }}/packagemaker-output/*.iflapp

