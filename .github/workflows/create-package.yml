name: Create Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la versión que se debe publicar'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      complete: ${{ steps.lookup.outputs.complete }}
    permissions:
      contents: read
    steps:
      - name: Check whether the release already has both platform assets
        id: lookup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          linux_asset="$(printf '%s\n' "$assets" | grep -E -- '-Danenone\.iflapp$' || true)"
          windows_asset="$(printf '%s\n' "$assets" | grep -E -- '-Knosthalij\.iflapp$' || true)"
          if [ -n "$linux_asset" ] && [ -n "$windows_asset" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG_NAME already contains Linux and Windows assets; build and release steps will be skipped."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG_NAME is missing the Linux or Windows asset; both platforms will be rebuilt."
          fi

  build-release:
    needs: release-check
    if: needs.release-check.outputs.complete != 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: Linux
          - os: windows-latest
            target: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r lib/requirements.txt
        shell: bash

      - name: Build release package with PackageMaker
        run: |
          python packagemaker.py --buildthis . --output "$RUNNER_TEMP/packagemaker-output" --platform "${{ matrix.target }}"
        shell: bash

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-iflapp-${{ matrix.target }}
          path: ${{ runner.temp }}/packagemaker-output/*.iflapp
          if-no-files-found: error

  release:
    needs: [release-check, build-release]
    if: needs.release-check.outputs.complete != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository for release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Delete incomplete release while preserving the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --yes
            echo "Deleted incomplete release $TAG_NAME; the Git tag was preserved."
          else
            echo "No existing release found for $TAG_NAME; creating it from scratch."
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-iflapp-*
          path: artifacts
          merge-multiple: true

      - name: Create release with both platform assets and release notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.tag_name || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*.iflapp
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
