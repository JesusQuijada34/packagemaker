
stages:
  - build
  - release

variables:
  GIT_DEPTH: 0
  GH_TOKEN: $GITHUB_TOKEN

.install_dependencies:
  before_script:
    - python3 -V
    - pip3 -V
    - pip3 install --upgrade pip
    - pip3 install -r lib/requirements.txt
    - apt-get update && apt-get install -y curl
    - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
    - apt-get update && apt-get install -y gh
    - gh auth setup-git

.install_windows_dependencies:
  before_script:
    - python -V
    - pip -V
    - pip install --upgrade pip
    - pip install -r lib/requirements.txt
    - choco install gh cli --confirm
    - gh auth setup-git

build_linux:
  stage: build
  image: python:3.9-slim-buster
  extends: .install_dependencies
  script:
    - echo "Iniciando compilación para Linux..."
    - mkdir -p "$CI_PROJECT_DIR/ci-artifacts"
    - python3 packagemaker.py --buildthis . --output "$CI_PROJECT_DIR/ci-artifacts" --platform Linux
    - ls -R ci-artifacts
  artifacts:
    paths:
      - ci-artifacts/*.iflapp
    expire_in: 1 week
  only:
    - main

build_windows:
  stage: build
  tags:
    - windows
  extends: .install_windows_dependencies
  script:
    - echo "Iniciando compilación para Windows..."
    - choco install gh cli --confirm
    - gh auth setup-git
    - New-Item -ItemType Directory -Force -Path "$CI_PROJECT_DIR\\ci-artifacts"
    - python packagemaker.py --buildthis . --output "$CI_PROJECT_DIR\\ci-artifacts" --platform Windows
    - Get-ChildItem -Recurse ci-artifacts
  artifacts:
    paths:
      - ci-artifacts/*.iflapp
    expire_in: 1 week
  only:
    - main

release_job:
  stage: release
  image: python:3.9-slim-buster
  extends: .install_dependencies
  script:
    - echo "Extrayendo versión de details.xml..."
    - python3 -c "import xml.etree.ElementTree as ET; root = ET.parse('details.xml').getroot(); version = root.findtext('version'); raise SystemExit('details.xml no contiene version') if not version else print(version.strip())" > VERSION_TAG.txt
    - VERSION=$(cat VERSION_TAG.txt)
    - echo "Versión detectada $VERSION"
    - |
      set -eu
      assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name' 2>/dev/null || true)"
      linux_asset="$(printf '%s\n' "$assets" | grep -E -- '-Danenone\.iflapp$' || true)"
      windows_asset="$(printf '%s\n' "$assets" | grep -E -- '-Knosthalij\.iflapp$' || true)"
      if [ -n "$linux_asset" ] && [ -n "$windows_asset" ]; then
        echo "El release $VERSION ya contiene los artefactos Linux y Windows; no se modifica."
        exit 0
      fi
      if gh release view "$VERSION" >/dev/null 2>&1; then
        echo "El release $VERSION está incompleto; se eliminará el release y se conservará el tag."
        gh release delete "$VERSION" --yes
      fi
    - |
      set -eu
      linux_file="$(find ci-artifacts -maxdepth 1 -type f -name '*-Danenone.iflapp' -print -quit)"
      windows_file="$(find ci-artifacts -maxdepth 1 -type f -name '*-Knosthalij.iflapp' -print -quit)"
      if [ -z "$linux_file" ] || [ -z "$windows_file" ]; then
        echo "Error: se requieren ambos artefactos canónicos (-Danenone y -Knosthalij)."
        exit 1
      fi
      if [ -f "RELEASE_NOTES.md" ]; then
        gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md --draft
      else
        gh release create "$VERSION" --title "$VERSION" --notes "" --draft
      fi
      gh release upload "$VERSION" "$linux_file" "$windows_file"
      if [ -f "RELEASE_NOTES.md" ]; then
        gh release edit "$VERSION" --notes-file RELEASE_NOTES.md
      fi
      gh release edit "$VERSION" --draft=false
      echo "Workflow de Release completado con ambos artefactos."
  dependencies:
    - build_linux
    - build_windows
  allow_failure: false
  only:
    - main
