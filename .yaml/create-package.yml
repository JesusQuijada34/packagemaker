# Template para crear paquetes finales (.iflapp) con GitHub Actions.
# Copia este archivo a .github/workflows/create-package.yml para activarlo.
name: Create Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: Linux
          - os: windows-latest
            target: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Install Python dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r lib/requirements.txt
        shell: bash

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r lib/requirements.txt
        shell: pwsh

      - name: Build release package with PackageMaker (Linux)
        if: runner.os == 'Linux'
        run: |
          python packagemaker.py --buildthis . --output "$RUNNER_TEMP/packagemaker-output" --platform Linux
        shell: bash

      - name: Build release package with PackageMaker (Windows)
        if: runner.os == 'Windows'
        run: |
          $output = Join-Path $env:RUNNER_TEMP "packagemaker-output"
          python packagemaker.py --buildthis . --output $output --platform Windows
        shell: pwsh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-iflapp-${{ matrix.target }}
          path: ${{ runner.temp }}/packagemaker-output/*.iflapp
          if-no-files-found: error
