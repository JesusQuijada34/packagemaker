apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.chaquo.python'

android {
    namespace "com.influent.packagemaker"
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.influent.packagemaker"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 1
        versionName "3.2.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        python {
            version "3.8"
            pyc {
                src false
            }
        }
    }
    signingConfigs {
        release {
            def ks = System.getenv('PACKAGEMAKER_KEYSTORE')
            def kp = System.getenv('PACKAGEMAKER_KEY_PASSWORD')
            if (ks && kp) {
                storeFile file(ks)
                storePassword kp
                keyAlias System.getenv('PACKAGEMAKER_KEY_ALIAS') ?: 'packagemaker'
                keyPassword kp
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.jcraft:jsch:0.1.55'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
}
