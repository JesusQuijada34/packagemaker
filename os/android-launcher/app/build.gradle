plugins {
    id 'com.android.application'
}

android {
    namespace 'com.influent.launcher'
    compileSdk 33

    defaultConfig {
        applicationId 'com.influent.launcher'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
