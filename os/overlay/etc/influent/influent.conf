# Influent OS Android runtime configuration
# The first backend is an AOSP/Cuttlefish x86_64 device, not Waydroid.
INFLUENT_ANDROID_BACKEND=aosp-cuttlefish
INFLUENT_ANDROID_HOME=/var/lib/influent/android
INFLUENT_APK_DIR=/var/lib/influent/apks
INFLUENT_ADB_BIN=/usr/bin/adb
INFLUENT_ANDROID_SERIAL=localhost:6520
INFLUENT_LAUNCHER_PACKAGE=com.influent.launcher
